<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Enviar Embed via Webhook - Ilegal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body {
    background: #1e1f22;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    background: #2b2d31;
    padding: 25px;
    border-radius: 12px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 20px;
    margin-bottom: 20px;
    text-align: center;
    color: #ed4245;
  }
  label {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
    color: #b5bac1;
    font-weight: 600;
  }
  input, textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #1e1f22;
    background: #1e1f22;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  input:focus, textarea:focus { border-color: #ed4245; }
  textarea { resize: vertical; min-height: 80px; }
  .color-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 15px;
  }
  .color-row input[type="color"] {
    width: 50px;
    height: 40px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #ed4245;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: #c93b3e; }
  button:disabled { background: #555; cursor: not-allowed; }
  .status {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
  }
  .success { color: #3ba55d; }
  .error { color: #ed4245; }
</style>
</head>
<body>

<div class="container">
  <h1>📨 Enviar Embed - Ilegal</h1>

  <label>URL do Webhook</label>
  <input type="text" id="webhook" placeholder="https://discord.com/api/webhooks/...">

  <label>Título do Embed</label>
  <input type="text" id="titulo" placeholder="Ex: Nova Denúncia">

  <label>Descrição</label>
  <textarea id="descricao" placeholder="Digite a mensagem aqui..."></textarea>

  <label>Cor do Embed</label>
  <div class="color-row">
    <input type="color" id="cor" value="#ed4245">
    <span id="corHex">#ed4245</span>
  </div>

  <label>Imagem (URL opcional)</label>
  <input type="text" id="imagem" placeholder="https://exemplo.com/imagem.png">

  <button id="btnEnviar">Enviar Embed</button>
  <div class="status" id="status"></div>
</div>

<script>
  const corInput = document.getElementById('cor');
  const corHex = document.getElementById('corHex');
  corInput.addEventListener('input', () => corHex.textContent = corInput.value);

  document.getElementById('btnEnviar').addEventListener('click', async () => {
    const webhook = document.getElementById('webhook').value.trim();
    const titulo = document.getElementById('titulo').value.trim();
    const descricao = document.getElementById('descricao').value.trim();
    const cor = document.getElementById('cor').value;
    const imagem = document.getElementById('imagem').value.trim();
    const status = document.getElementById('status');
    const btn = document.getElementById('btnEnviar');

    if (!webhook || !webhook.startsWith('https://discord.com/api/webhooks/')) {
      status.textContent = '❌ Cole um webhook válido do Discord!';
      status.className = 'status error';
      return;
    }

    if (!titulo && !descricao) {
      status.textContent = '❌ Preencha pelo menos o título ou a descrição.';
      status.className = 'status error';
      return;
    }

    // Converte a cor hex para decimal (Discord usa int)
    const corDecimal = parseInt(cor.replace('#', ''), 16);

    const embed = {
      title: titulo || undefined,
      description: descricao || undefined,
      color: corDecimal,
      timestamp: new Date().toISOString(),
      footer: { text: 'ILG' }
    };

    if (imagem) embed.image = { url: imagem };

    const payload = {
      username: 'Ilegal',
      avatar_url: 'https://ui-avatars.com/api/?name=ILG&background=000000&color=ed4245&bold=true&size=256',
      embeds: [embed]
    };

    btn.disabled = true;
    status.textContent = '⏳ Enviando...';
    status.className = 'status';

    try {
      const resposta = await fetch(webhook, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (resposta.ok) {
        status.textContent = '✅ Embed enviada com sucesso!';
        status.className = 'status success';
      } else {
        const erro = await resposta.text();
        status.textContent = '❌ Erro: ' + resposta.status;
        status.className = 'status error';
        console.error(erro);
      }
    } catch (e) {
      status.textContent = '❌ Falha na requisição: ' + e.message;
      status.className = 'status error';
    }

    btn.disabled = false;
  });
</script>

</body>
</html>
